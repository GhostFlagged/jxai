[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jxai"
version = "0.1.0"
description = "Multi-target JS security audit pipeline with a target management web app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "jsbeautifier>=1.14.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
jxai = "main:main"

[tool.setuptools]
packages = ["jxai", "skills", "ai"]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.package-data]
jxai = ["templates/*.html", "static/*.css", "defaults.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]